# Alembic configuration (specification §4: Alembic for database migrations).
#
# The database URL is NOT stored here. `alembic/env.py` resolves it from the
# `DATABASE_URL` environment variable and falls back to the packaged default
# in `publisher.core.config.Settings` (spec §14: environment-driven config).
# Override for a single run, e.g.:
#   DATABASE_URL=sqlite:////tmp/publisher.db alembic upgrade head

[alembic]
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
